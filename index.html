<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GTA Browser 3D</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6b8f55;font-family:Arial;color:white}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}.brand{position:absolute;top:20px;left:25px;font-size:24px;font-weight:bold}.stats{position:absolute;top:20px;right:25px;font-size:18px}.stats span{margin-left:20px}.help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#0009;padding:10px 16px;border-radius:8px}.status{position:absolute;top:58px;right:25px;font-weight:bold}</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="brand">GTA BROWSER 3D</div><div class="stats"><span>HEALTH <b id="health">100</b></span><span>MONEY $<b id="money">500</b></span></div><div id="status" class="status">WALKING</div><div class="help">WASD move · Shift sprint · E enter/exit car · R reset</div></div>
<script src="game.js"></script>
</body></html>
