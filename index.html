<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Browser 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div class="brand">GTA BROWSER 3D</div>
    <div class="stats"><span>HEALTH <b id="health">100</b></span><span>MONEY $<b id="money">500</b></span></div>
    <div id="status">WALKING</div>
    <div class="help">WASD move · Mouse look · Shift sprint · E enter/exit car · R reset</div>
  </div>
  <div id="crosshair">+</div>
  <div id="message"></div>
  <script type="module" src="game.js"></script>
</body>
</html>
